<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AscendantKH — War Map</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e13;--bg-card:#111419;--bg-input:#181c26;--bg-hover:#1c2032;
  --border:rgba(255,255,255,.07);--border-hi:rgba(255,255,255,.13);
  --gold:#c9983a;--gold-dim:rgba(201,152,58,.15);--gold-glow:rgba(201,152,58,.3);
  --text1:#e4e6f0;--text2:#7a7e9a;--text3:#3e4260;
  --heal:#27a06a;--tank:#c9783a;--dps:#3a7fd4;
  --r:10px;--r-sm:7px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text1);font-family:'Outfit',sans-serif;font-size:14px;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(201,152,58,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(201,152,58,.02) 1px,transparent 1px);background-size:52px 52px;pointer-events:none;z-index:0;}

/* TOP BAR */
.topbar{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;background:var(--bg-card);border-bottom:1px solid var(--border);flex-shrink:0;gap:1rem;flex-wrap:wrap;}
.topbar-left{display:flex;align-items:center;gap:1rem}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.08em;color:var(--text1)}
.logo span{color:var(--gold)}
.back-btn{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);background:none;border:1px solid var(--border-hi);border-radius:var(--r-sm);padding:5px 12px;cursor:pointer;text-decoration:none;transition:all .18s;display:inline-flex;align-items:center;gap:5px;}
.back-btn:hover{color:var(--text1);background:var(--bg-hover)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool-btn{background:var(--bg-input);border:1px solid var(--border-hi);border-radius:var(--r-sm);padding:6px 10px;cursor:pointer;color:var(--text2);font-size:12px;font-family:'Outfit',sans-serif;transition:all .18s;display:flex;align-items:center;gap:5px;white-space:nowrap;border:none;}
.tool-btn:hover{background:var(--bg-hover);color:var(--text1)}
.tool-btn.active{background:var(--gold-dim);border:1px solid var(--gold);color:var(--gold)}
.tool-btn.danger:hover{background:rgba(201,79,79,.15);color:#c94f4f}
.divider{width:1px;height:24px;background:var(--border-hi);flex-shrink:0}
.zoom-info{font-size:11px;color:var(--text3);min-width:40px;text-align:center}

/* MAIN */
.main{position:relative;z-index:1;display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:210px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;z-index:5;}
.sidebar-section{padding:.875rem 1rem;border-bottom:1px solid var(--border)}
.sidebar-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.sidebar-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border-hi),transparent)}
.obj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.obj-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 3px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-input);cursor:grab;transition:all .18s;user-select:none;}
.obj-item:hover{border-color:var(--gold);background:var(--gold-dim);transform:translateY(-1px)}
.obj-item:active{cursor:grabbing}
.obj-item img{width:26px;height:26px;object-fit:contain;pointer-events:none}
.obj-item span{font-size:8px;color:var(--text3);text-align:center;line-height:1.2}
.obj-item:hover span{color:var(--gold)}
.draw-tools{display:flex;flex-direction:column;gap:6px}
.color-row{display:flex;gap:5px;flex-wrap:wrap}
.color-swatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-swatch.active{border-color:#fff;transform:scale(1.25)}
.size-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.size-row label{font-size:10px;color:var(--text3)}
.size-row input{flex:1;accent-color:var(--gold)}
.player-list{display:flex;flex-direction:column;gap:4px}
.player-chip{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-input);cursor:grab;font-size:11px;color:var(--text1);transition:all .15s;user-select:none;}
.player-chip:hover{border-color:var(--border-hi);background:var(--bg-hover)}
.player-chip.placed{opacity:.4;cursor:default}
.role-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.role-dot.heal{background:var(--heal)}.role-dot.tank{background:var(--tank)}.role-dot.dps{background:var(--dps)}
.day-tabs{display:flex;gap:6px;margin-bottom:.75rem}
.day-tab{flex:1;padding:5px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-family:'Outfit',sans-serif;background:var(--bg-input);border:1px solid var(--border-hi);border-radius:var(--r-sm);color:var(--text3);cursor:pointer;transition:all .18s}
.day-tab.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
.day-panel{display:flex;flex-direction:column;gap:8px}
.team-group{}
.team-group-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:4px 0 5px;display:flex;align-items:center;gap:5px}
.team-group-label.defend{color:var(--def)}
.team-group-label.attack{color:var(--atk)}
.team-group-label::after{content:'';flex:1;height:1px;background:currentColor;opacity:.2}
.player-list{display:flex;flex-direction:column;gap:3px}
.pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.side-tag{font-size:9px;padding:1px 5px;border-radius:10px;font-weight:600;white-space:nowrap}
.side-tag.top{background:rgba(58,127,212,.2);color:#5aaaf5}
.side-tag.bot{background:rgba(201,120,58,.2);color:#e8943a}
.no-players{font-size:11px;color:var(--text3);text-align:center;padding:.75rem 0}

/* MAP VIEWPORT */
.map-viewport{flex:1;position:relative;overflow:hidden;background:#080a0f;cursor:grab;}
.map-viewport.grabbing{cursor:grabbing}
.map-viewport.drawing{cursor:crosshair}

/* MAP WORLD — this is what gets scaled/translated */
#map-world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}
#map-canvas{display:block;}
#markers-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}

/* MARKERS */
.marker{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:all;cursor:move;user-select:none;z-index:20;}
.marker:hover img{filter:drop-shadow(0 0 6px var(--gold))}
.marker img{width:36px;height:36px;object-fit:contain;pointer-events:none;display:block;}
.marker .mlabel{font-size:9px;font-weight:600;color:#fff;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:10px;white-space:nowrap;pointer-events:none;}
.del-btn{position:absolute;top:-8px;right:-8px;width:16px;height:16px;border-radius:50%;background:#c94f4f;border:none;color:#fff;font-size:10px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:30;line-height:1;}
.marker:hover .del-btn{display:flex}

/* PLAYER MARKERS */
.pmarker{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:all;cursor:move;user-select:none;z-index:21;}
.pmarker-inner{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.3);transition:box-shadow .15s;pointer-events:none;}
.pmarker-inner.heal{background:var(--heal)}.pmarker-inner.tank{background:var(--tank)}.pmarker-inner.dps{background:var(--dps)}
.pmarker:hover .pmarker-inner{box-shadow:0 0 0 3px var(--gold)}
.pmarker .pmlabel{font-size:8px;font-weight:600;color:#fff;background:rgba(0,0,0,.75);padding:1px 5px;border-radius:10px;white-space:nowrap;pointer-events:none;max-width:72px;overflow:hidden;text-overflow:ellipsis;}
.pmarker .del-btn{top:-6px;right:-6px;width:14px;height:14px;font-size:9px;}
.pmarker:hover .del-btn{display:flex}

/* STATUS */
.statusbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(13,15,20,.85);backdrop-filter:blur(8px);border:1px solid var(--border-hi);border-radius:20px;padding:5px 14px;font-size:11px;color:var(--text2);z-index:30;pointer-events:none;letter-spacing:.04em;white-space:nowrap;}

/* TOAST */
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%) translateY(-120%);background:var(--bg-card);border:1px solid var(--border-hi);border-radius:var(--r);padding:.6rem 1.1rem;font-size:12px;font-weight:500;z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(39,160,106,.4);color:var(--heal)}
.toast.err{border-color:rgba(201,79,79,.4);color:#c94f4f}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="back-btn">← Register</a>
    <div class="logo">AscendantKH <span>War Map</span></div>
  </div>
  <div class="topbar-right">
    <button class="tool-btn active" id="btn-select" onclick="setMode('select')">↖ Select</button>
    <button class="tool-btn" id="btn-pan" onclick="setMode('pan')">✋ Pan</button>
    <button class="tool-btn" id="btn-draw" onclick="setMode('draw')">✏️ Draw</button>
    <button class="tool-btn" id="btn-arrow" onclick="setMode('arrow')">➡️ Arrow</button>
    <div class="divider"></div>
    <button class="tool-btn" onclick="zoomIn()">＋</button>
    <span class="zoom-info" id="zoom-info">100%</span>
    <button class="tool-btn" onclick="zoomOut()">－</button>
    <button class="tool-btn" onclick="resetZoom()">⌂</button>
    <div class="divider"></div>
    <button class="tool-btn" onclick="undoLast()">↶ Undo</button>
    <button class="tool-btn danger" onclick="clearAll()">🧹 Clear</button>
    <div class="divider"></div>
    <button class="tool-btn" onclick="exportMap()">📥 Export</button>
    <button class="tool-btn" onclick="importMap()">📤 Import</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-label">Objectives</div>
      <div class="obj-grid" id="obj-grid">
        <div class="obj-item" draggable="true" data-src="objective/boss.png" data-label="Boss" ondragstart="objDragStart(event)">
          <img src="objective/boss.png"><span>Boss</span>
        </div>
        <div class="obj-item" draggable="true" data-src="objective/tower_blue.png" data-label="Tower A" ondragstart="objDragStart(event)">
          <img src="objective/tower_blue.png"><span>Tower A</span>
        </div>
        <div class="obj-item" draggable="true" data-src="objective/tower_red.png" data-label="Tower E" ondragstart="objDragStart(event)">
          <img src="objective/tower_red.png"><span>Tower E</span>
        </div>
        <div class="obj-item" draggable="true" data-src="objective/tree_blue.png" data-label="Tree A" ondragstart="objDragStart(event)">
          <img src="objective/tree_blue.png"><span>Tree A</span>
        </div>
        <div class="obj-item" draggable="true" data-src="objective/tree_red.png" data-label="Tree E" ondragstart="objDragStart(event)">
          <img src="objective/tree_red.png"><span>Tree E</span>
        </div>
        <div class="obj-item" draggable="true" data-src="objective/goose_blue.png" data-label="Goose A" ondragstart="objDragStart(event)">
          <img src="objective/goose_blue.png"><span>Goose A</span>
        </div>
        <div class="obj-item" draggable="true" data-src="objective/goose_red.png" data-label="Goose E" ondragstart="objDragStart(event)">
          <img src="objective/goose_red.png"><span>Goose E</span>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Draw</div>
      <div class="draw-tools">
        <div class="color-row" id="color-row">
          <div class="color-swatch active" style="background:#c9983a" data-color="#c9983a" onclick="setColor(this)"></div>
          <div class="color-swatch" style="background:#c94f4f" data-color="#c94f4f" onclick="setColor(this)"></div>
          <div class="color-swatch" style="background:#3a7fd4" data-color="#3a7fd4" onclick="setColor(this)"></div>
          <div class="color-swatch" style="background:#27a06a" data-color="#27a06a" onclick="setColor(this)"></div>
          <div class="color-swatch" style="background:#ffffff" data-color="#ffffff" onclick="setColor(this)"></div>
          <div class="color-swatch" style="background:#f5c542" data-color="#f5c542" onclick="setColor(this)"></div>
        </div>
        <div class="size-row">

          <input type="range" id="brush-size" min="2" max="20" value="4" oninput="brushSize=+this.value">

    </div>

    <div class="sidebar-section" style="flex:1;overflow-y:auto;padding:.75rem .875rem">
      <div class="sidebar-label">Players</div>

      <!-- DAY TABS -->
      <div class="day-tabs">
        <button class="day-tab active" id="tab-sat" onclick="switchDay('sat')">Sat</button>
        <button class="day-tab" id="tab-sun" onclick="switchDay('sun')">Sun</button>

      <div id="players-sat" class="day-panel"></div>

  </div>

  <!-- MAP VIEWPORT -->
  <div class="map-viewport" id="map-viewport"
    ondragover="event.preventDefault()"
    ondrop="onDrop(event)">

    <!-- WORLD: canvas + markers together, both get zoomed/panned -->
    <div id="map-world">
      <canvas id="map-canvas"></canvas>
      <div id="markers-layer"></div>
    </div>

    <div class="statusbar" id="statusbar">↖ Select — drag objectives or players · Scroll to zoom · Pan with ✋</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCUJfamdNNdK9MbuYUk_5cZJj6ncrO5_6E",
  authDomain: "ascendantkh-gw.firebaseapp.com",
  databaseURL: "https://ascendantkh-gw-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ascendantkh-gw",
  storageBucket: "ascendantkh-gw.firebasestorage.app",
  messagingSenderId: "181758417135",
  appId: "1:181758417135:web:aada38d84e8ddd977ba31a"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ── WEEK KEY ──
function getWeekKey() {
  const now = new Date();
  const day = now.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff);
  const yyyy = monday.getFullYear();
  const mm   = String(monday.getMonth() + 1).padStart(2, '0');
  const dd   = String(monday.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

// ── STATE ──
let mode = 'select';
let drawColor = '#c9983a';
let brushSize = 4;
let drawHistory = [];
let currentPath = [];
let isDrawing = false;
let dragSrc = null;

// ── ZOOM / PAN STATE ──
let zoom = 1;
let panX = 0;
let panY = 0;
let isPanning = false;
let panStart = { x: 0, y: 0 };
let panOrigin = { x: 0, y: 0 };

const viewport  = document.getElementById('map-viewport');
const world     = document.getElementById('map-world');
const canvas    = document.getElementById('map-canvas');
const ctx       = canvas.getContext('2d');
const markersLayer = document.getElementById('markers-layer');

// ── MAP IMAGE ──
const mapImg = new Image();
mapImg.crossOrigin = 'anonymous';
mapImg.src = 'https://raw.githubusercontent.com/Threather/ascendantkh-gw/main/map.png';
mapImg.onload = () => {
  canvas.width  = mapImg.naturalWidth;
  canvas.height = mapImg.naturalHeight;
  markersLayer.style.width  = canvas.width  + 'px';
  markersLayer.style.height = canvas.height + 'px';
  world.style.width  = canvas.width  + 'px';
  world.style.height = canvas.height + 'px';
  // fit map to viewport on load
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const fitZoom = Math.min(vw / canvas.width, vh / canvas.height) * 0.95;
  zoom = fitZoom;
  panX = (vw - canvas.width  * zoom) / 2;
  panY = (vh - canvas.height * zoom) / 2;
  applyTransform();
  redrawCanvas();
};
mapImg.onerror = () => showToast('map.png not found — check your repo', false);

function applyTransform() {
  world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoom-info').textContent = Math.round(zoom * 100) + '%';
}

function redrawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (mapImg.complete && mapImg.naturalWidth) {
    ctx.drawImage(mapImg, 0, 0);
  }
  drawHistory.forEach(p => drawPath(p));
}

function drawPath(path) {
  if (!path || path.points.length < 2) return;
  ctx.beginPath();
  ctx.strokeStyle = path.color;
  ctx.lineWidth   = path.size;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.moveTo(path.points[0].x, path.points[0].y);
  path.points.forEach(pt => ctx.lineTo(pt.x, pt.y));
  ctx.stroke();
  if (path.arrow) {
    const pts   = path.points;
    const last  = pts[pts.length - 1];
    const prev  = pts[pts.length - 2] || pts[0];
    const angle = Math.atan2(last.y - prev.y, last.x - prev.x);
    const len   = 18 / zoom;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(last.x - len * Math.cos(angle - 0.4), last.y - len * Math.sin(angle - 0.4));
    ctx.lineTo(last.x - len * Math.cos(angle + 0.4), last.y - len * Math.sin(angle + 0.4));
    ctx.closePath();
    ctx.fillStyle = path.color;
    ctx.fill();
  }
}

// Convert viewport coords → canvas (world) coords
function toWorld(cx, cy) {
  return {
    x: (cx - panX) / zoom,
    y: (cy - panY) / zoom
  };
}

// ── ZOOM ──
window.zoomIn    = () => { doZoom(1.2, viewport.clientWidth/2, viewport.clientHeight/2); };
window.zoomOut   = () => { doZoom(0.8, viewport.clientWidth/2, viewport.clientHeight/2); };
window.resetZoom = () => {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  zoom = Math.min(vw / canvas.width, vh / canvas.height) * 0.95;
  panX = (vw - canvas.width  * zoom) / 2;
  panY = (vh - canvas.height * zoom) / 2;
  applyTransform();
};

function doZoom(factor, cx, cy) {
  const newZoom = Math.min(Math.max(zoom * factor, 0.15), 6);
  panX = cx - (cx - panX) * (newZoom / zoom);
  panY = cy - (cy - panY) * (newZoom / zoom);
  zoom = newZoom;
  applyTransform();
}

// Mouse wheel zoom
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  doZoom(e.deltaY < 0 ? 1.12 : 0.9, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

// Pinch zoom (touch)
let lastPinchDist = null;
viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    lastPinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });
viewport.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (lastPinchDist) {
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const rect = viewport.getBoundingClientRect();
      doZoom(dist / lastPinchDist, midX - rect.left, midY - rect.top);
    }
    lastPinchDist = dist;
  }
}, { passive: false });
viewport.addEventListener('touchend', () => { lastPinchDist = null; });

// ── PAN (mouse) ──
viewport.addEventListener('mousedown', e => {
  if (mode === 'pan' || e.button === 1) {
    isPanning = true;
    panStart  = { x: e.clientX, y: e.clientY };
    panOrigin = { x: panX, y: panY };
    viewport.classList.add('grabbing');
    e.preventDefault();
  }
});
window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  panX = panOrigin.x + (e.clientX - panStart.x);
  panY = panOrigin.y + (e.clientY - panStart.y);
  applyTransform();
});
window.addEventListener('mouseup', () => {
  if (isPanning) { isPanning = false; viewport.classList.remove('grabbing'); }
});

// PAN (touch single finger in pan mode)
viewport.addEventListener('touchstart', e => {
  if (mode === 'pan' && e.touches.length === 1) {
    isPanning = true;
    panStart  = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    panOrigin = { x: panX, y: panY };
  }
}, { passive: true });
viewport.addEventListener('touchmove', e => {
  if (isPanning && e.touches.length === 1) {
    panX = panOrigin.x + (e.touches[0].clientX - panStart.x);
    panY = panOrigin.y + (e.touches[0].clientY - panStart.y);
    applyTransform();
  }
}, { passive: true });
viewport.addEventListener('touchend', () => { isPanning = false; });

// ── DRAW ──
function getCanvasPoint(e) {
  const rect = viewport.getBoundingClientRect();
  const cx = (e.clientX ?? e.touches[0].clientX) - rect.left;
  const cy = (e.clientY ?? e.touches[0].clientY) - rect.top;
  return toWorld(cx, cy);
}

canvas.addEventListener('mousedown', e => {
  if (mode !== 'draw' && mode !== 'arrow') return;
  isDrawing = true;
  currentPath = [getCanvasPoint(e)];
});
canvas.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  currentPath.push(getCanvasPoint(e));
  redrawCanvas();
  drawPath({ points: currentPath, color: drawColor, size: brushSize / zoom, arrow: mode === 'arrow' });
});
canvas.addEventListener('mouseup', () => {
  if (!isDrawing) return;
  isDrawing = false;
  if (currentPath.length > 1) drawHistory.push({ points:[...currentPath], color:drawColor, size:brushSize/zoom, arrow:mode==='arrow' });
  currentPath = [];
  redrawCanvas();
});
canvas.addEventListener('mouseleave', () => { isDrawing = false; });

// ── DRAG FROM SIDEBAR ──
window.objDragStart = function(e) {
  dragSrc = { type:'obj', src: e.currentTarget.dataset.src, label: e.currentTarget.dataset.label };
  e.dataTransfer.effectAllowed = 'copy';
};

// ── DROP ON VIEWPORT ──
window.onDrop = function(e) {
  e.preventDefault();
  if (!dragSrc) return;
  const rect = viewport.getBoundingClientRect();
  const wx   = (e.clientX - rect.left - panX) / zoom;
  const wy   = (e.clientY - rect.top  - panY) / zoom;
  if (dragSrc.type === 'obj')    placeObj(dragSrc.src, dragSrc.label, wx, wy);
  if (dragSrc.type === 'player') placePly(dragSrc.player, wx, wy);
  dragSrc = null;
};

// ── PLACE OBJECTIVE ──
function placeObj(src, label, wx, wy) {
  const el = document.createElement('div');
  el.className = 'marker';
  el.style.left = wx + 'px';
  el.style.top  = wy + 'px';
  el.innerHTML = `<img src="${src}"><span class="mlabel">${label}</span><button class="del-btn" onclick="this.parentElement.remove()">✕</button>`;
  makeDraggable(el);
  markersLayer.appendChild(el);
}

// ── PLACE PLAYER ──
function placePly(p, wx, wy) {
  // remove old marker if re-placing
  const old = markersLayer.querySelector(`.pmarker[data-name="${p.name}"]`);
  if (old) old.remove();

  const el = document.createElement('div');
  el.className = 'pmarker';
  el.dataset.name = p.name;
  el.style.left   = wx + 'px';
  el.style.top    = wy + 'px';
  const initials  = p.name.slice(0,2).toUpperCase();
  el.innerHTML = `<div class="pmarker-inner ${p.role}">${initials}</div><span class="pmlabel">${p.name}</span><button class="del-btn" onclick="removePly(this)">✕</button>`;
  makeDraggable(el);
  markersLayer.appendChild(el);

  const chips = document.querySelectorAll(`.player-chip[data-name="${p.name}"]`);
  chips.forEach(c => c.classList.add('placed'));
}

window.removePly = function(btn) {
  const el   = btn.parentElement;
  const name = el.dataset.name;
  el.remove();
  const chips = document.querySelectorAll(`.player-chip[data-name="${name}"]`);
  chips.forEach(c => c.classList.remove('placed'));
};

// ── MAKE MARKER DRAGGABLE (inside world coords) ──
function makeDraggable(el) {
  let startX, startY, startLeft, startTop;

  const onDown = e => {
    if (e.target.classList.contains('del-btn')) return;
    if (mode !== 'select') return;
    e.preventDefault();
    e.stopPropagation();

    const isTouch = e.touches;
    const clientX = isTouch ? e.touches[0].clientX : e.clientX;
    const clientY = isTouch ? e.touches[0].clientY : e.clientY;

    startX    = clientX;
    startY    = clientY;
    startLeft = parseFloat(el.style.left);
    startTop  = parseFloat(el.style.top);

    const onMove = ev => {
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
      // delta in viewport px → convert to world coords by dividing by zoom
      el.style.left = (startLeft + (cx - startX) / zoom) + 'px';
      el.style.top  = (startTop  + (cy - startY) / zoom) + 'px';
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
  };

  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onDown, { passive: false });
}

// ── MODE ──
window.setMode = function(m) {
  mode = m;
  ['select','pan','draw','arrow'].forEach(id => {
    document.getElementById('btn-'+id)?.classList.toggle('active', id === m);
  });
  viewport.classList.toggle('drawing', m === 'draw' || m === 'arrow');
  const hints = {
    select: '↖ Select — drag markers to move · Drag objectives & players from sidebar',
    pan:    '✋ Pan — click and drag to move the map',
    draw:   '✏️ Draw — freehand drawing',
    arrow:  '➡️ Arrow — draw directional arrows'
  };
  document.getElementById('statusbar').textContent = hints[m];
};

window.setColor = function(el) {
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  drawColor = el.dataset.color;
};

window.undoLast = function() {
  if (!drawHistory.length) return;
  drawHistory.pop();
  redrawCanvas();
};

window.clearAll = function() {
  if (!confirm('Clear all drawings and markers?')) return;
  drawHistory = [];
  markersLayer.innerHTML = '';
  document.querySelectorAll('.player-chip').forEach(c => c.classList.remove('placed'));
  redrawCanvas();
};

window.exportMap = function() {
  const state = { drawHistory };
  const blob  = new Blob([JSON.stringify(state)], { type:'application/json' });
  const a     = document.createElement('a');
  a.href      = URL.createObjectURL(blob);
  a.download  = `warmap-${getWeekKey()}.json`;
  a.click();
  showToast('Strategy exported!', true);
};

window.importMap = function() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const state = JSON.parse(ev.target.result);
        drawHistory = state.drawHistory || [];
        markersLayer.innerHTML = '';
        redrawCanvas();
        showToast('Strategy imported!', true);
      } catch { showToast('Invalid file', false); }
    };
    reader.readAsText(e.target.files[0]);
  };
  inp.click();
};

let toastT;
function showToast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.className = 'toast', 3000);
}

// ── FIREBASE PLAYERS ──
let allPlayers = [];
const baseRef = ref(db, `guild_wars/${getWeekKey()}/registrations`);
onValue(baseRef, snap => {
  const val = snap.val();
  allPlayers = val ? Object.entries(val).map(([k,v]) => ({_key:k,...v})) : [];
  renderPlayerSidebar();
});

function renderPlayerSidebar() {
  ['sat','sun'].forEach(day => {
    const dayLabel = day === 'sat' ? 'Saturday' : 'Sunday';
    const panel    = document.getElementById('players-' + day);
    const dayP     = allPlayers.filter(p => !p.isReserve && (p.avail === dayLabel || p.avail === 'Sat & Sun'));

    if (dayP.length === 0) {
      panel.innerHTML = '<div class="no-players">No players for this day</div>';
      return;
    }

    const teams = [
      { key: 'defend', label: '🛡 Defend', cls: 'defend' },
      { key: 'attack', label: '⚔ Attack',  cls: 'attack'  }
    ];

    panel.innerHTML = teams.map(t => {
      const tp = dayP.filter(p => p.team === t.key);
      if (tp.length === 0) return '';
      const chips = tp.map(p => {
        const sideTag = p.jungleSide ? `<span class="side-tag ${p.jungleSide==='Top'?'top':'bot'}">${p.jungleSide}</span>` : '';
        return `<div class="player-chip" data-name="${p.name}" draggable="true">
          <span class="role-dot ${p.role}"></span>
          <span class="pname">${p.name}</span>
          ${sideTag}
        </div>`;
      }).join('');
      return `<div class="team-group">
        <div class="team-group-label ${t.cls}">${t.label} (${tp.length})</div>
        <div class="player-list">${chips}</div>
      </div>`;
    }).join('');

    // bind drag events
    panel.querySelectorAll('.player-chip').forEach(chip => {
      const name = chip.dataset.name;
      const p    = allPlayers.find(x => x.name === name);
      if (!p) return;
      chip.addEventListener('dragstart', e => {
        dragSrc = { type: 'player', player: p };
        e.dataTransfer.effectAllowed = 'copy';
      });
    });
  });
}

window.switchDay = function(day) {
  document.getElementById('tab-sat').classList.toggle('active', day === 'sat');
  document.getElementById('tab-sun').classList.toggle('active', day === 'sun');
  document.getElementById('players-sat').style.display = day === 'sat' ? 'flex' : 'none';
  document.getElementById('players-sun').style.display = day === 'sun' ? 'flex' : 'none';
};

window.setMode('select');
</script>
